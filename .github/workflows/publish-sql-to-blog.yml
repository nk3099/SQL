
name: Publish SQL to Astro Blog

on:
  push:
    branches: [ master ]          # SQL repo uses master
    paths:
      - '**/*.sql'                # run when any .sql changes
  workflow_dispatch: {}           # allow manual trigger for testing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SQL repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug recent changes
        run: |
          echo "Recent commits:"
          git --no-pager log --oneline -5
          echo "Changed .sql files in last commit:"
          git --no-pager diff --name-only HEAD~1 HEAD | grep -E '\.sql$' || echo "No .sql changes detected."

      - name: Checkout Blog repo (Astro, branch: main)
        uses: actions/checkout@v4
        with:
          repository: nk3099/neeraj-astro-blog
          token: ${{ secrets.BLOG_REPO_PAT }}   # PAT with 'repo' scope, stored in SQL repo secrets
          path: blog
          fetch-depth: 0                         # important to avoid non-fast-forward push errors
          ref: main                              # explicitly check out blog main branch

      - name: Ensure posts directory exists
        run: |
          mkdir -p blog/src/pages/posts
          ls -la blog/src/pages/posts || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Astro Markdown from .sql (Problem + Setup + Solution)
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const ROOT = process.cwd();
          const BLOG_DIR = path.join(ROOT, 'blog');
          const POSTS_DIR = path.join(BLOG_DIR, 'src', 'pages', 'posts');
          fs.mkdirSync(POSTS_DIR, { recursive: true });

          const slugify = (s) =>
            s.toLowerCase()
             .replace(/\s+/g, '-')
             .replace(/[^\w-]/g, '')
             .replace(/-+/g, '-')
             .replace(/^-|-$/g, '');

          const nowIST = () => new Date(Date.now() + 5.5 * 60 * 60 * 1000).toISOString().slice(0, 10);

          const walk = (dir) => {
            let out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (full.startsWith(BLOG_DIR)) continue; // skip blog checkout
              if (entry.isDirectory()) out = out.concat(walk(full));
              else if (entry.isFile() && full.endsWith('.sql')) out.push(full);
            }
            return out;
          };

          function parseSqlFile(sqlText) {
            const lines = sqlText.split(/\r?\n/);
            const meta = { title: '', date: '', tags: [] };
            let problemLines = [], setupLines = [], solutionLines = [];
            let section = null;

            const isComment = (l) => l.trim().startsWith('--');
            const isSelect = (l) => /^\s*SELECT\s+/i.test(l);

            for (const l of lines) {
              // Meta markers
              if (/^\s*--\s*TITLE:/i.test(l)) { meta.title = l.replace(/^\s*--\s*TITLE:\s*/i,'').trim(); continue; }
              if (/^\s*--\s*DATE:/i.test(l))  { meta.date  = l.replace(/^\s*--\s*DATE:\s*/i,'').trim();  continue; }
              if (/^\s*--\s*TAGS:/i.test(l))  {
                meta.tags = l.replace(/^\s*--\s*TAGS:\s*/i,'').split(',').map(s=>s.trim()).filter(Boolean);
                continue;
              }
              // Section markers
              if (/^\s*--\s*PROBLEM:/i.test(l))  { section='problem';  continue; }
              if (/^\s*--\s*SETUP:/i.test(l))    { section='setup';    continue; }
              if (/^\s*--\s*SOLUTION:/i.test(l)) { section='solution'; continue; }
              if (/^\s*--\s*END\s+PROBLEM/i.test(l))  { section=null; continue; }
              if (/^\s*--\s*END\s+SETUP/i.test(l))    { section=null; continue; }
              if (/^\s*--\s*END\s+SOLUTION/i.test(l)) { section=null; continue; }

              if (section==='problem')  problemLines.push(l.replace(/^\s*--\s?/, ''));
              else if (section==='setup')    setupLines.push(l);
              else if (section==='solution') solutionLines.push(l);
            }

            // Fallbacks if markers missing
            if (problemLines.length===0) {
              for (const l of lines) { if (isComment(l)) problemLines.push(l.replace(/^\s*--\s?/, '')); else break; }
            }
            if (setupLines.length===0 || solutionLines.length===0) {
              let lastSelectIdx = -1;
              lines.forEach((l,idx)=>{ if (isSelect(l)) lastSelectIdx = idx; });
              if (lastSelectIdx !== -1) {
                solutionLines = lines.slice(lastSelectIdx).filter(Boolean);
                setupLines = lines.slice(0, lastSelectIdx).filter(Boolean);
              } else {
                setupLines = lines; // no SELECT → treat all as setup
              }
            }

            // Auto tags if none
            if (meta.tags.length===0) {
              const joined = lines.join('\n').toUpperCase();
              const tags = new Set(['SQL']);
              if (joined.includes('CROSS APPLY')) tags.add('CROSS APPLY');
              if (joined.includes('STRING_SPLIT') || joined.includes('STRING SPLIT')) tags.add('STRING_SPLIT');
              meta.tags = Array.from(tags);
            }

